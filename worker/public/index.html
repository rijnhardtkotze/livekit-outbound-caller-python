<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveKit Outbound Caller</title>
  <style>
    :root {
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --success-color: #10b981;
      --error-color: #ef4444;
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .logo svg {
      width: 40px;
      height: 40px;
    }

    .logo h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .description {
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    .hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    button {
      width: 100%;
      padding: 0.875rem 1.5rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .status {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }

    .status.success {
      display: block;
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .status.error {
      display: block;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .status.loading {
      display: block;
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .rooms-section {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-color);
    }

    .rooms-section h2 {
      font-size: 1.125rem;
      margin-bottom: 1rem;
    }

    .room-list {
      list-style: none;
    }

    .room-item {
      padding: 0.75rem;
      background: var(--bg-color);
      border-radius: 6px;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .room-name {
      font-family: monospace;
      color: var(--primary-color);
    }

    .room-participants {
      color: var(--text-muted);
    }

    .refresh-btn {
      width: auto;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .no-rooms {
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="#6366f1"/>
        </svg>
        <h1>Outbound Caller</h1>
      </div>

      <p class="description">
        Make outbound calls using LiveKit's AI-powered voice agent. Enter a phone number 
        and optionally a transfer number for human handoff.
      </p>

      <form id="callForm">
        <div class="form-group">
          <label for="phoneNumber">Phone Number *</label>
          <input 
            type="tel" 
            id="phoneNumber" 
            name="phoneNumber" 
            placeholder="+1234567890"
            required
          >
          <p class="hint">Include country code (e.g., +1 for US)</p>
        </div>

        <div class="form-group">
          <label for="transferTo">Transfer To (Optional)</label>
          <input 
            type="tel" 
            id="transferTo" 
            name="transferTo" 
            placeholder="+9876543210"
          >
          <p class="hint">Number to transfer to when customer requests human agent</p>
        </div>

        <button type="submit" id="submitBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="currentColor"/>
          </svg>
          Make Call
        </button>
      </form>

      <div id="status" class="status"></div>

      <div class="rooms-section">
        <h2>Active Calls</h2>
        <button type="button" class="refresh-btn" id="refreshBtn" onclick="loadRooms()">
          Refresh
        </button>
        <ul class="room-list" id="roomList">
          <li class="no-rooms">No active calls</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('callForm');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const roomList = document.getElementById('roomList');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const phoneNumber = document.getElementById('phoneNumber').value.trim();
      const transferTo = document.getElementById('transferTo').value.trim();

      // Show loading state
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="spinner"></div> Dispatching...';
      statusDiv.className = 'status loading';
      statusDiv.textContent = 'Dispatching call to ' + phoneNumber + '...';

      try {
        const response = await fetch('/api/dispatch', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ phoneNumber, transferTo: transferTo || undefined }),
        });

        const data = await response.json();

        if (response.ok) {
          statusDiv.className = 'status success';
          statusDiv.innerHTML = `
            <strong>Call dispatched successfully!</strong><br>
            Room: <code>${data.roomName}</code><br>
            The agent will now dial ${phoneNumber}.
          `;
          // Clear form
          form.reset();
          // Refresh rooms list
          setTimeout(loadRooms, 2000);
        } else {
          statusDiv.className = 'status error';
          statusDiv.innerHTML = `
            <strong>Error:</strong> ${data.error}<br>
            ${data.details ? `Details: ${data.details}` : ''}
          `;
        }
      } catch (error) {
        statusDiv.className = 'status error';
        statusDiv.textContent = 'Network error. Please check your connection and try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="currentColor"/>
          </svg>
          Make Call
        `;
      }
    });

    async function loadRooms() {
      const refreshBtn = document.getElementById('refreshBtn');
      refreshBtn.disabled = true;
      refreshBtn.textContent = 'Loading...';

      try {
        const response = await fetch('/api/rooms');
        const data = await response.json();

        if (response.ok && data.rooms) {
          if (data.rooms.length === 0) {
            roomList.innerHTML = '<li class="no-rooms">No active calls</li>';
          } else {
            roomList.innerHTML = data.rooms.map(room => `
              <li class="room-item">
                <span class="room-name">${room.name}</span>
                <span class="room-participants">${room.numParticipants} participant(s)</span>
              </li>
            `).join('');
          }
        }
      } catch (error) {
        roomList.innerHTML = '<li class="no-rooms">Failed to load rooms</li>';
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = 'Refresh';
      }
    }

    // Load rooms on page load
    loadRooms();
  </script>
</body>
</html>
