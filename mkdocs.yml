site_name: LiveKit Outbound Caller
site_description: Documentation for the Python Outbound Call Agent using LiveKit
site_author: LiveKit
repo_url: https://github.com/livekit-examples/outbound-caller-python

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Quick Start: getting-started/quickstart.md
  - Guides:
    - Making Calls: guides/making-calls.md
    - Function Tools: guides/function-tools.md
    - Call Transfers: guides/call-transfers.md
    - Voicemail Detection: guides/voicemail-detection.md
  - API Reference:
    - Agent Class: api/agent.md
    - Entrypoint: api/entrypoint.md
  - Contributing:
    - Development: contributing/development.md
    - AI Assistants: contributing/ai-assistants.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/livekit-examples/outbound-caller-python
